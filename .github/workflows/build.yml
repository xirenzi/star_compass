name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libwebkit2gtk-6.0-dev libjavascriptcoregtk-6.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: |
          cd src-tauri
          cargo tauri build --bundles deb,appimage --
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  build-android:
    strategy:
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install Android NDK
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "${{ github.workspace }}"
          echo "ANDROID_NDK_ROOT=${{ github.workspace }}/android-ndk-r26b" >> "$GITHUB_ENV"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }} --
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-android-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/star_compass_tauri
          retention-days: 7

  build-apk:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Android binaries
        uses: actions/download-artifact@v4
        with:
          path: android-libs
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add aarch64-linux-android
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jdk
      - name: Install Android SDK
        run: |
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk
          mkdir -p /tmp/android-sdk/cmdline-tools/latest
          mv /tmp/android-sdk/cmdline-tools/bin /tmp/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          mv /tmp/android-sdk/cmdline-tools/lib /tmp/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=/tmp/android-sdk" >> "$GITHUB_ENV"
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true
      - name: Install Android NDK
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK_ROOT=/tmp/android-ndk-r26b" >> "$GITHUB_ENV"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build APK
        run: |
          cd src-tauri
          cargo tauri build --bundles apk --target aarch64-linux-android --
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-android-apk
          path: src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk
          retention-days: 14

  release:
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/star_compass_tauri
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
