name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          cd src-tauri
          cargo build --release
          Copy-Item target/release/star-compass-tauri.exe target/release/star-compass-windows.exe
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-windows-exe
          path: src-tauri/target/release/star-compass-windows.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          cd src-tauri
          cargo build --release
          cp target/release/star-compass-tauri target/release/star-compass-appimage
          chmod +x target/release/star-compass-appimage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-appimage
          path: src-tauri/target/release/star-compass-appimage
          retention-days: 7
      - name: Build deb
        run: |
          cargo install --git https://github.com/tauri-apps/tauri.git debcargo
          cargo deb --manifest-path src-tauri/Cargo.toml -p star-compass-tauri -o target/release/star-compass.deb
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-deb
          path: src-tauri/target/release/star-compass.deb
          retention-days: 7

  build-android:
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: aarch64-linux-android
            api: "21"
          - target: armv7-linux-androideabi
            abi: arm-linux-androideabi
            api: "21"
          - target: i686-linux-android
            abi: i686-linux-android
            api: "21"
          - target: x86_64-linux-android
            abi: x86_64-linux-android
            api: "21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install Android NDK r23b
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r23b-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "${{ github.workspace }}"
      - name: Configure cargo linker (direct clang, no wrapper)
        run: |
          NDK="${{ github.workspace }}/android-ndk-r23b"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="${TOOLCHAIN}/sysroot"
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << TOML
          [target.${{ matrix.target }}]
          linker = "${TOOLCHAIN}/bin/clang"
          rustflags = [
            "-C", "link-arg=--target=${{ matrix.target }}${{ matrix.api }}",
            "-C", "link-arg=--sysroot=${SYSROOT}",
            "-C", "link-arg=-gcc-toolchain=${TOOLCHAIN}",
            "-C", "target-feature=+crt-static"
          ]
          TOML
          echo "----- generated config.toml -----"
          cat src-tauri/.cargo/config.toml
          echo "----- verify clang exists -----"
          ls -la "${TOOLCHAIN}/bin/clang"
      - name: Build static binary
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/star-compass-tauri" "target/${{ matrix.target }}/release/star-compass-android-${{ matrix.target }}"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-android-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/star-compass-android-${{ matrix.target }}
          retention-days: 7

  release:
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/star-compass-android-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
