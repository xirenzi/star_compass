name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: |
          cd src-tauri
          cargo tauri build --bundles deb,appimage --
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build
        run: |
          cd src-tauri
          cargo tauri build --bundles nsis --
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  build-android:
    strategy:
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install Android NDK r26b (stable, widely compatible)
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "${{ github.workspace }}"
          echo "ANDROID_NDK_ROOT=${{ github.workspace }}/android-ndk-r26b" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build and rename
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/star-compass-tauri target/${{ matrix.target }}/release/star-compass-android-${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: star-compass-android-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/star-compass-android-${{ matrix.target }}
          retention-days: 7

  release:
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/star-compass-android-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
