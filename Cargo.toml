[package]
name = "star_compass"
version = "0.1.0"
edition = "2021"
authors = ["Star Compass Team"]
description = "星枢加密体系 - 精密校准版 · 三才合一"
license = "MIT OR Apache-2.0"
repository = ""
keywords = ["cryptography", "post-quantum", "secure-messaging"]
categories = ["cryptography", "security"]

[lib]
name = "star_compass"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# 密码学核心
aes-gcm = "0.9"
argon2 = "0.5"
curve25519-dalek = { version = "4.1", features = ["rand_core"] }
x25519-dalek = "2.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
poly1305 = "0.8"
digest = "0.10"
generic-array = "0.14"
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"

# 后量子：Kyber（简化实现，生产用 pqcrypto_kyber）
# kyber = "0.2"

# 时间/日期天文计算
chrono = { version = "0.4", features = ["serde"] }
julian = "0.1"
nalgebra = "0.33"

# 错误处理 & 异步
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
zeroize = { version = "1.5", features = ["derive"] }
hex = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
